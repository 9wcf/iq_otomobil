# Codemagic: بناء iOS ورفعه للـ App Store Connect تلقائياً
#
# المتطلبات (تسويها مرة وحدة من موقع Codemagic):
# 1) Connect to Apple: حمّل مفتاح App Store Connect API (.p8) من
#    appstoreconnect.apple.com > Users and Access > Integrations > App Store Connect API
# 2) ربط حساب GitHub (الريبو 9wcf/iq_otomobil)
# 3) الإعدادات داخل Codemagic > App settings:
#    - iOS code signing: Automatic (Codemagic ينشئ الشهادة والـ Provisioning تلقائياً)
#    - App Store Connect publishing: مفعّل مع الإيداع التلقائي
#
# بعدها كل push على فرع main يبني ويرفع build جديد لـ TestFlight.

workflows:
  ios-appstore:
    name: iOS App Store Release
    integrations:
      app_store_connect: Sakan-Admin
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: iq.iqtomobil.customer
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: تحميل اعتماديات Flutter
        script: |
          flutter packages pub get
      - name: تشخيص App Store Connect (مؤقت)
        script: |
          echo "Issuer set: $([ -n "${APP_STORE_CONNECT_ISSUER_ID:-}" ] && echo yes || echo no)"
          echo "Key ID set: $([ -n "${APP_STORE_CONNECT_KEY_IDENTIFIER:-}" ] && echo yes || echo no)"
          echo "=== apps list (strict match $BUNDLE_ID) ==="
          app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier || true
          echo "=== all apps visible to this API key ==="
          app-store-connect apps list || true
          echo "=== altool providers ==="
          xcrun altool --list-providers \
            --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" || true
      - name: إنشاء الشهادة والبروفايل تلقائياً
        script: |
          set -e
          keychain initialize
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY is not set."
            exit 1
          fi
          CERT_KEY="$CM_BUILD_DIR/cert_key.pem"
          KEY_CLEAN=$(printf '%s' "$CERTIFICATE_PRIVATE_KEY" | tr -d ' \t\r\n')
          echo "Key material length: ${#KEY_CLEAN} chars"
          case "$KEY_CLEAN" in
            -----BEGIN*)
              printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > "$CERT_KEY"
              ;;
            *)
              if ! printf '%s' "$KEY_CLEAN" | python3 -c "import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read(), validate=True))" > "$CERT_KEY"; then
                echo "ERROR: CERTIFICATE_PRIVATE_KEY is not valid base64."
                echo "It should start with LS0t and end with Cg==. Re-copy the full line between SAVE_CERT_KEY_START/END."
                exit 1
              fi
              ;;
          esac
          if ! openssl pkey -in "$CERT_KEY" -noout; then
            echo "ERROR: decoded value is not a valid RSA private key (got ${#KEY_CLEAN} chars)."
            echo "The copied value is likely truncated. Re-copy the complete line from the build log."
            exit 1
          fi
          echo "Certificate private key is valid"
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --certificate-key=@file:"$CERT_KEY"
          keychain add-certificates
          xcode-project use-profiles
      - name: بناء iOS (Release)
        script: |
          flutter build ipa --release \
            --build-number=$(($(date +%s) / 60)) \
            --export-options-plist=$HOME/export_options.plist
      - name: رفع إلى TestFlight
        script: |
          set -e
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "Uploading: $IPA"
          KEY_ID="$APP_STORE_CONNECT_KEY_IDENTIFIER"
          ISSUER_ID="$APP_STORE_CONNECT_ISSUER_ID"
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          # altool في Xcode 26 عنده خلل بمعالجة الـ providers، نستخدم المسار القديم
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --use-old-altool
    artifacts:
      - build/ios/ipa/*.ipa
