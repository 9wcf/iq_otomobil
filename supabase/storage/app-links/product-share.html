<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IQ OTOMBIL — فتح المنتج</title>
  <style>
    body{margin:0;min-height:100vh;font-family:Segoe UI,Tahoma,Arial,sans-serif;background:#f3f4f6;display:grid;place-items:center;padding:24px;color:#1a1d26}
    .card{width:min(420px,100%);background:#fff;border-radius:20px;padding:28px 24px;box-shadow:0 12px 40px rgba(26,29,38,.08);text-align:center}
    h1{margin:0 0 8px;font-size:1.2rem}
    p{margin:0 0 20px;color:#6b7280;line-height:1.6}
    a{display:block;border-radius:14px;padding:14px 16px;font-size:1rem;font-weight:700;text-decoration:none;margin-bottom:10px}
    .primary{background:#4f7cff;color:#fff}
    .secondary{background:#eef2ff;color:#4f7cff}
  </style>
</head>
<body>
  <main class="card">
    <h1>جاري فتح المنتج في IQ OTOMBIL</h1>
    <p>إذا لم يفتح التطبيق، ثبّته من المتجر ثم أعد فتح الرابط.</p>
    <a id="openAppBtn" class="primary" href="#">فتح في التطبيق</a>
    <a id="installBtn" class="secondary" href="#">تثبيت التطبيق</a>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var productId = params.get("id") || "";
      var PLAY_STORE = "https://play.google.com/store/apps/details?id=iq.iqotomobil";
      var APP_STORE = "https://apps.apple.com/search?term=IQ+OTOMBIL";
      var CUSTOM_SCHEME = "iqotomobil";
      var ANDROID_PACKAGE = "iq.iqotomobil";
      var isAndroid = /android/i.test(navigator.userAgent);
      var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      var installUrl = isIOS ? APP_STORE : PLAY_STORE;
      var openUrl = productId
        ? CUSTOM_SCHEME + "://product/" + encodeURIComponent(productId)
        : installUrl;
      document.getElementById("installBtn").href = installUrl;
      document.getElementById("openAppBtn").href = openUrl;
      function tryOpenApp() {
        if (!productId) { window.location.replace(installUrl); return; }
        if (isAndroid) {
          window.location.href =
            "intent://product/" + encodeURIComponent(productId) +
            "#Intent;scheme=" + CUSTOM_SCHEME + ";package=" + ANDROID_PACKAGE +
            ";S.browser_fallback_url=" + encodeURIComponent(installUrl) + ";end";
          return;
        }
        window.location.href = openUrl;
        setTimeout(function () { window.location.replace(installUrl); }, 2200);
      }
      document.getElementById("openAppBtn").addEventListener("click", function (e) {
        e.preventDefault();
        tryOpenApp();
      });
      tryOpenApp();
    })();
  </script>
</body>
</html>
