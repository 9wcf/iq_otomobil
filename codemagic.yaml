# Codemagic: بناء iOS ورفعه للـ App Store Connect تلقائياً
#
# المتطلبات (تسويها مرة وحدة من موقع Codemagic):
# 1) Connect to Apple: حمّل مفتاح App Store Connect API (.p8) من
#    appstoreconnect.apple.com > Users and Access > Integrations > App Store Connect API
# 2) ربط حساب GitHub (الريبو 9wcf/iq_otomobil)
# 3) الإعدادات داخل Codemagic > App settings:
#    - iOS code signing: Automatic (Codemagic ينشئ الشهادة والـ Provisioning تلقائياً)
#    - App Store Connect publishing: مفعّل مع الإيداع التلقائي
#
# بعدها كل push على فرع main يبني ويرفع build جديد لـ TestFlight.

workflows:
  ios-appstore:
    name: iOS App Store Release
    integrations:
      app_store_connect: Sakan-Admin
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: iq.iqtomobil.customer
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: تحميل اعتماديات Flutter
        script: |
          flutter packages pub get
      - name: إنشاء الشهادة والبروفايل تلقائياً
        script: |
          set -e
          keychain initialize
          CERT_KEY="$CM_BUILD_DIR/cert_key.pem"
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY is not set."
            echo "Add it as a secure variable in the ios_signing group (base64 RSA key from a previous build log)."
            exit 1
          fi
          printf '%s' "$CERTIFICATE_PRIVATE_KEY" > "$CERT_KEY"
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --certificate-key=@file:"$CERT_KEY"
          keychain add-certificates
          xcode-project use-profiles
      - name: بناء iOS (Release)
        script: |
          flutter build ipa --release \
            --build-number=$(($(date +%s) / 60)) \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # عندما تريد الإرسال للمراجعة، غيّرها إلى true:
        submit_to_app_store: false
