<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IQ OTOMBIL — فتح المنتج</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f4f6;
      --card: #ffffff;
      --primary: #4f7cff;
      --text: #1a1d26;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: linear-gradient(180deg, #e8eeff 0%, var(--bg) 40%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(420px, 100%);
      background: var(--card);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 12px 40px rgba(26, 29, 38, 0.08);
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #e0e9ff;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      font-size: 28px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.25rem;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.6;
    }
    .actions {
      display: grid;
      gap: 10px;
    }
    a, button {
      appearance: none;
      border: 0;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: block;
    }
    .primary {
      background: var(--primary);
      color: #fff;
    }
    .secondary {
      background: #eef2ff;
      color: var(--primary);
    }
    .hint {
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">🚗</div>
    <h1>جاري فتح المنتج في IQ OTOMBIL</h1>
    <p id="status">إذا لم يفتح التطبيق تلقائياً، ثبّته من المتجر ثم أعد فتح الرابط.</p>
    <div class="actions">
      <a id="openAppBtn" class="primary" href="#">فتح في التطبيق</a>
      <a id="installBtn" class="secondary" href="#">تثبيت التطبيق</a>
    </div>
    <p class="hint" id="productHint"></p>
  </main>

  <script>
    (function () {
      var PLAY_STORE =
        "https://play.google.com/store/apps/details?id=iq.iqotomobil";
      var APP_STORE =
        "https://apps.apple.com/app/id0000000000";
      var CUSTOM_SCHEME = "iqotomobil";

      function getProductId() {
        var parts = window.location.pathname.split("/").filter(Boolean);
        if (parts[0] === "product" && parts[1]) {
          return decodeURIComponent(parts[1]);
        }
        var params = new URLSearchParams(window.location.search);
        return params.get("id") || "";
      }

      function isAndroid() {
        return /android/i.test(navigator.userAgent);
      }

      function isIOS() {
        return /iphone|ipad|ipod/i.test(navigator.userAgent);
      }

      function storeUrl() {
        if (isIOS()) return APP_STORE;
        return PLAY_STORE;
      }

      function appDeepLink(productId) {
        return CUSTOM_SCHEME + "://product/" + encodeURIComponent(productId);
      }

      function androidIntentUrl(productId, fallback) {
        return (
          "intent://product/" +
          encodeURIComponent(productId) +
          "#Intent;scheme=" +
          CUSTOM_SCHEME +
          ";package=iq.iqotomobil;S.browser_fallback_url=" +
          encodeURIComponent(fallback) +
          ";end"
        );
      }

      var productId = getProductId();
      var installUrl = storeUrl();
      var openUrl = productId ? appDeepLink(productId) : installUrl;

      var openBtn = document.getElementById("openAppBtn");
      var installBtn = document.getElementById("installBtn");
      var hint = document.getElementById("productHint");

      installBtn.href = installUrl;
      openBtn.href = openUrl;
      if (productId) {
        hint.textContent = "رقم المنتج: " + productId;
      }

      function tryOpenApp() {
        if (!productId) {
          window.location.replace(installUrl);
          return;
        }

        if (isAndroid()) {
          window.location.href = androidIntentUrl(productId, installUrl);
          return;
        }

        window.location.href = openUrl;
        window.setTimeout(function () {
          window.location.replace(installUrl);
        }, 2200);
      }

      openBtn.addEventListener("click", function (e) {
        e.preventDefault();
        tryOpenApp();
      });

      tryOpenApp();
    })();
  </script>
</body>
</html>
