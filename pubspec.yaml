name: iq_otomobil
description: IQ OTOMBIL - تطبيق قطع غيار السيارات واللوحات
publish_to: 'none'

version: 2.0.3+9

environment:
  sdk: '^3.9.2'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  http: ^1.4.0
  flutter_secure_storage: ^9.2.4
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  cached_network_image: ^3.4.0
  lottie: ^3.3.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.20.0
  dartz: ^0.10.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.0
  fl_chart: ^0.69.0
  flutter_rating_bar: ^4.0.1
  shared_preferences: ^2.2.0
  share_plus: ^10.1.4
  app_links: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.2
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/brands/
    - assets/categories/
    - assets/nav/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#E0E9FF"
  android: true
  ios: true
  android_12:
    color: "#E0E9FF"
